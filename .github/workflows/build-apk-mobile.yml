
name: Build Game Streaming APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v6

      - name: Build Flet APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Game-Streaming-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
